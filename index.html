<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141918" media="(prefers-color-scheme: dark)">
<title>Go Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="titleBox"><h1>Go Coach</h1><div id="verStamp" class="verStamp"></div></div>
  <button data-t-aria="screen.settings.aria" id="btnSettings" class="icon" aria-label="Settings">⚙</button>
</header>

<main>
  <section id="playView" class="stage">
    <div class="boardCol">
      <div id="statusBar"><span id="whoTurn"></span><span id="posInfo" class="pos" hidden><i id="posB"></i><b id="posL"></b><b id="posR"></b></span><span data-t-title="screen.prisoners.tip" id="capsInfo" title="Prisoners: stones each colour has lost"></span><button data-t-aria="screen.board-size.aria" data-t-title="screen.board-size.tip" type="button" id="btnBoardSize" class="boardSize" aria-label="Show the board full screen" aria-pressed="false" title="Show the board full screen"></button></div>
      <div class="boardWrap"><canvas id="playBoard"></canvas></div>
      <div id="boardBar" class="boardBar">
        <div class="barSide">
          <button data-t-aria="screen.undo-arrow.aria" data-t-title="screen.undo-arrow.tip" type="button" id="btnUndoArrow" class="tab tri back" aria-label="Undo" title="Take back your last move"></button>
          <button data-t-aria="screen.redo-arrow.aria" data-t-title="screen.redo-arrow.tip" type="button" id="btnRedoArrow" class="tab tri fwd" aria-label="Redo" title="Play again the move you took back"></button>
        </div>
        <div class="barSide">
          <button data-t="screen.shapes" type="button" id="btnShapes" class="tab" aria-pressed="false">Shapes</button>
          <button data-t="screen.territory" type="button" id="btnTerr" class="tab" aria-pressed="false">Territory</button>
        </div>
      </div>
      <div id="puzzleBar" class="boardBar puzzleBar" hidden>
        <button type="button" id="btnPFirst" class="tab ico" data-t-aria="screen.puzzle-first.aria" data-t-title="screen.puzzle-first.tip" aria-label="Back to the start" title="Back to the start of the puzzle"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="3" height="14"/><polygon points="20,5 20,19 9,12"/></svg></button>
        <button type="button" id="btnPUndo" class="tab ico" data-t-aria="screen.puzzle-undo.aria" data-t-title="screen.puzzle-undo.tip" aria-label="Undo" title="Take back your last move"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="17,5 17,19 6,12"/></svg></button>
        <button type="button" id="btnPRedo" class="tab ico" data-t-aria="screen.puzzle-redo.aria" data-t-title="screen.puzzle-redo.tip" aria-label="Redo" title="Play again the move you took back"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="7,5 7,19 18,12"/></svg></button>
        <button type="button" id="btnPLast" class="tab ico" data-t-aria="screen.puzzle-last.aria" data-t-title="screen.puzzle-last.tip" aria-label="To the end" title="Forward to the last move you played"><svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="4,5 4,19 15,12"/><rect x="17" y="5" width="3" height="14"/></svg></button>
      </div>
    </div>
    <aside class="panel">
      <div class="row controls" id="controls">
        <button data-t="screen.mode" id="btnMode">Play mode</button>
        <button data-t="screen.pass" id="btnPass">Pass</button>
        <!-- Undo and Redo are the triangles under the board; these hidden buttons hold their state (boardbar.js) and serve the chat's "undo". -->
        <button data-t="screen.undo" id="btnUndo" hidden>Undo</button>
        <button data-t="screen.redo" id="btnRedo" hidden>Redo</button>
        <button data-t="screen.analyse" id="btnAnalyse">Analyse</button>
        <button data-t="screen.resign" id="btnResign">Resign</button>
        <button data-t="screen.setup" id="btnSetup">Set up</button>
        <button data-t="screen.setup-cancel" id="btnSCancel" hidden>Cancel</button>
        <button data-t="screen.save" id="btnSave">Save</button>
        <button data-t="screen.new" id="btnNew" class="primary">New</button>
      </div>
      <div data-t-aria="screen.move-tree.aria" data-t-title="screen.move-tree.tip" id="moveTree" class="moveTree" role="group" aria-label="Moves of this game" title="Every move of this game. Tap one to go back to it; moves you tried before stay as branches."></div>
      <div class="row controls" id="lessonBar" hidden>
        <button data-t="screen.puzzle-back" id="btnLBack" hidden>Back to game</button>
        <button data-t="screen.lesson-hint" id="btnLHint">Hint</button>
        <button data-t="screen.lesson-reset" id="btnLReset">Reset</button>
        <button data-t="screen.lesson-next" id="btnLNext" class="primary">Next</button>
        <button data-t="screen.lesson-menu" id="btnLMenu">Lessons</button>
      </div>
      <div class="row controls" id="kifuBar" hidden>
        <button data-t="screen.kifu-first" data-t-title="screen.kifu-first.tip" id="btnKFirst" title="Go to the start of the game">« First</button>
        <button data-t="screen.kifu-back" data-t-title="screen.kifu-back.tip" id="btnKBack" title="One move back (left arrow key)">‹ Back</button>
        <button data-t="screen.kifu-auto" data-t-title="screen.kifu-auto.tip" id="btnKAuto" title="Play the game through automatically">Auto</button>
        <button data-t="screen.kifu-next" data-t-title="screen.kifu-next.tip" id="btnKNext" class="primary" title="One move forward (right arrow key)">Next ›</button>
        <button data-t="screen.kifu-last" data-t-title="screen.kifu-last.tip" id="btnKLast" title="Go to the end of the game">Last »</button>
        <button data-t="screen.kifu-analyse" data-t-title="screen.kifu-analyse.tip" id="btnKAnalyse" title="Suggest moves for this position">Analyse</button>
        <button data-t="screen.kifu-games" data-t-title="screen.kifu-games.tip" id="btnKList" title="Choose another game">Games</button>
        <button data-t="screen.kifu-exit" data-t-title="screen.kifu-exit.tip" id="btnKExit" title="Back to your own game">Exit</button>
        <input data-t-aria="screen.kifu-slider.aria" type="range" id="kifuSlider" min="0" max="0" value="0" aria-label="Move number">
      </div>
      <div id="quizOptions" class="row wrap" hidden></div>
      <div id="scorePanel" class="note" hidden>
        <p id="scoreText"></p>
        <div class="row">
          <button data-t="screen.confirm" id="btnConfirm" class="primary">Confirm result</button>
          <button data-t="screen.keep-playing" id="btnResume">Keep playing</button>
        </div>
      </div>
      <!-- The coach's latest message, shown only while the board is full screen (boardbig.js). -->
      <div id="coachStrip" class="coachStrip"><div class="stripText" aria-live="polite"></div><div class="stripNav"><button data-t-aria="screen.strip-up.aria" data-t-title="screen.strip-up.aria" type="button" id="btnStripUp" aria-label="Earlier message" title="Earlier message">˄</button><span id="stripCount" class="stripCount"></span><button data-t-aria="screen.strip-down.aria" data-t-title="screen.strip-down.aria" type="button" id="btnStripDown" aria-label="Later message" title="Later message">˅</button></div></div>
      <div id="chat" class="chat">
        <button data-t-aria="screen.chat-size.aria" data-t-title="screen.chat-size.tip" type="button" id="btnChatSize" class="chatSize" aria-label="Enlarge the chat" aria-pressed="false" title="Enlarge the chat"></button>
        <div class="chatLog" aria-live="polite"></div>
        <div class="quick"></div>
        <form class="chatForm" autocomplete="off">
          <input data-t-placeholder="screen.chat-input.hint" data-t-aria="screen.chat-input.aria" class="chatInput" type="text" placeholder="Ask your coach…" aria-label="Message to the coach" enterkeyhint="send">
          <button data-t="screen.clear" data-t-aria="screen.clear.aria" type="button" id="btnClear" aria-label="Clear the chat">Clear</button>
          <button data-t="screen.send" type="submit" class="primary">Send</button>
        </form>
      </div>
    </aside>
  </section>
</main>

<dialog id="newDlg">
  <div class="dlgTabs" role="tablist">
    <button type="button" role="tab" id="tabNewGame" class="dlgTab" aria-selected="true" data-t="screen.new-game">New game</button>
    <button type="button" role="tab" id="tabSavedGames" class="dlgTab" aria-selected="false" data-t="screen.saved-games">Saved games</button>
  </div>
  <form method="dialog" id="newForm">
    <div id="optSize" class="opt"></div>
    <div id="optColour" class="opt"></div>
    <div id="optLevel" class="opt"></div>
    <div id="optHandicap" class="opt"></div>
    <p class="small" id="newHelp"></p>
    <div class="row end">
      <button data-t="screen.cancel" value="cancel" formnovalidate>Cancel</button>
      <button data-t="screen.start" value="start" class="primary" id="btnStart">Start</button>
    </div>
  </form>
  <div id="savedPane" hidden>
    <div id="savedList" class="saves"></div>
    <p class="small" id="savedMsg"></p>
    <div class="row end"><button type="button" data-t="screen.close" id="btnSavedClose">Close</button></div>
  </div>
</dialog>

<dialog id="setDlg">
  <form method="dialog">
    <h2><span data-t="screen.settings">Settings</span><span id="acctTag"></span></h2>
    <h3 class="grp" data-t="screen.set-board">Board</h3>
    <label class="switch"><input type="checkbox" id="setCoords"> <span data-t="screen.coords">Show coordinates</span></label>
    <label class="switch"><input type="checkbox" id="setLibs"> <span data-t="screen.libs">Show liberties (green dots, red when in atari)</span></label>
    <label class="switch"><input type="checkbox" id="setConfirm"> <span data-t="screen.tap-twice">Tap twice to place (avoids slips on a phone)</span></label>
    <label class="switch"><input type="checkbox" id="setSound"> <span data-t="screen.sound">Stone sound</span></label>
    <h3 class="grp" data-t="screen.set-coach">Coach</h3>
    <label class="switch"><input type="checkbox" id="setCoach"> <span data-t="screen.coach-tips">Coach tips</span></label>
    <div class="opt">
      <label class="lbl" for="setTerrSecs"><span data-t="screen.accuracy-before">Territory accuracy: up to</span> <b id="terrSecsOut"></b> <span data-t="screen.accuracy-after">per map</span></label>
      <input type="range" id="setTerrSecs" min="0" max="9" step="1" aria-describedby="terrHelp">
      <p data-t="screen.accuracy-help" class="small" id="terrHelp">The Territory tab plays random games after every move. A longer time means more games and a steadier map, but a longer wait.</p>
    </div>
    <h3 class="grp" data-t="screen.set-general">General</h3>
    <div class="row wrap"><button data-t="screen.copy-sgf" type="button" id="btnSGF">Copy game record (SGF)</button></div>
    <div class="opt inline">
      <label class="lbl" for="setGcLevel" data-t="screen.game-level">Level of Puzzle mode:</label>
      <select id="setGcLevel">
        <option value="6" data-t="screen.level-much-easier">Much easier</option>
        <option value="3" data-t="screen.level-easier">Easier</option>
        <option value="0" data-t="screen.level-grade">At my grade</option>
        <option value="-3" data-t="screen.level-harder">Harder</option>
        <option value="-6" data-t="screen.level-much-harder">Much harder</option>
      </select>
    </div>
    <div class="row wrap"><button data-t="screen.check-updates" type="button" id="btnUpdate">Check for updates</button></div>
    <p class="small" id="verText"></p>
    <p class="small" id="installHelp"></p>
    <div class="row end"><button data-t="screen.clear-account" type="button" id="btnClearAcct">Clear Account</button><button data-t="screen.done" value="close" class="primary">Done</button></div>
  </form>
</dialog>

<dialog id="resultDlg">
  <form method="dialog">
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <div class="row end">
      <button data-t="screen.close" value="close">Close</button>
      <button data-t="screen.result-new" value="new" class="primary" id="btnResultNew">New game</button>
    </div>
  </form>
</dialog>

<div id="boardTip" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
